<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPL 2026 Ticket Booking</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

<header>
    <h1>Welcome to IPL 2026 Ticket Booking</h1>

    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="index.html#matches">Matches</a></li>
            <li><a href="index.html#guidelines">Guidelines</a></li>
        </ul>
    </nav>
</header>

<main>
    <section id="booking">
        <h2>Book Your Tickets</h2>

        <form action="#" method="post">
            <label for="name">Name:</label>
            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your full name"
                minlength="3"
                maxlength="50"
                required
            >

            <label for="email">Email:</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="example@email.com"
                required
            >

            <label for="phone">Phone Number:</label>
            <input
                type="tel"
                id="phone"
                name="phone"
                placeholder="Enter 10-digit number"
                minlength="10"
                maxlength="10"
                pattern="[0-9]{10}"
                title="Enter a valid 10-digit phone number"
                required
            >

            <label for="match">Select Match:</label>
            <select id="match" name="match" required>
                <option value="">-- Select Match --</option>
                <option value="RCB vs CSK">RCB vs CSK</option>
                <option value="CSK vs KKR">CSK vs Kolkata Knight Riders</option>
                <option value="MI vs SRH">Mumbai Indians vs Sunrisers Hyderabad</option>
                <option value="RCB vs PBKS">Rajasthan Royals vs Punjab Kings</option>
                <option value="SRH vs RCB">Sunrisers Hyderabad vs RCB</option>
                <option value="RCB vs KKR">KKR vs RCB</option>
            </select>

            <label for="stand">Select Stand:</label>
            <select id="stand" name="stand" required>
                <option value="">-- Select Stand --</option>
                <option value="General">General Stand</option>
                <option value="Premium">Premium Stand</option>
                <option value="VIP">VIP Stand</option>
                <option value="Reserved">Reserved Stand</option>
                <option value="Fan">Fan Stand</option>
            </select>

            <label for="ticket">Number of Tickets:</label>
            <input
                type="number"
                id="ticket"
                name="ticket"
                min="1"
                max="10"
                placeholder="Enter number of tickets (1-10)"
                required
            >

            <label>Ticket Delivery Preference:</label>
            <label><input type="radio" name="delivery" value="e-ticket" style="width: auto;" required> E-Ticket (QR Code)</label>
            <label><input type="radio" name="delivery" value="physical" style="width: auto;"> Box Office Pickup</label>

            <label>Additional Preferences:</label>
            <label><input type="checkbox" name="addons" value="parking" style="width: auto;"> Stadium Parking Pass</label>
            <label><input type="checkbox" name="terms" style="width: auto;" required> I agree to the stadium rules and guidelines</label>

            <div>
                <button type="submit">Book Tickets</button>
                <button type="reset">Reset</button>
            </div>
        </form>
    </section>
</main>

<footer>
    <p>&copy; 2026 IPL Ticket Booking. All Rights Reserved.</p>
</footer>

</body>
</html>
